server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: api-app

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-read-cookie: false
  is-read-header: true
  token-style: uuid

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
